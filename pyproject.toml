[project]
name = "site-auditor"
dynamic = ["version"]
description = "Comprehensive website audit tool — security, SEO, performance, accessibility, DNS, legal and markup checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Lorsbach" }]
keywords = ["website-audit", "seo", "security", "accessibility", "dns", "wordpress", "geo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    "dnspython>=2.6.0",
    "ipwhois>=1.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/Tobeworks/Site-Auditor"
Issues = "https://github.com/Tobeworks/Site-Auditor/issues"

[project.optional-dependencies]
cli = ["rich>=13.7.0"]
ai = ["anthropic>=0.28.0"]

[project.scripts]
site-auditor = "auditor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditor"]

[tool.hatch.version]
path = "auditor/__init__.py"
